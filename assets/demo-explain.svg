<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" role="img"
     aria-label="Terminal demo: typing `qmark explain &quot;rm -rf ./build&quot;`; after a short pause the plain-English explanation appears, warning the operation can't be undone.">
  <!-- Hand-written animated terminal cast, same technique as demo.svg. The
       explanation text is copied verbatim from a real `qmark explain` run
       against a local Ollama model, so it cannot drift into fiction.
       ponytail: no recorder toolchain (vhs/asciinema) — 10s CSS loop instead. -->
  <style>
    .t { font-family: SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
         font-size: 14px; white-space: pre; }
    .fg   { fill: #c9d1d9 }
    .dim  { fill: #8b949e }
    .grn  { fill: #7ee787 }
    .anim { animation-duration: 10s; animation-iteration-count: infinite;
            animation-timing-function: steps(1, end); }

    /* Prompt line, built up in keystroke chunks. */
    #l1 { animation-name: l1 } #l2 { animation-name: l2 } #l3 { animation-name: l3 }
    #l4 { animation-name: l4 } #l5 { animation-name: l5 }
    @keyframes l1 { 0%,3.9% {opacity:1}  4%,100% {opacity:0} }
    @keyframes l2 { 0%,3.9% {opacity:0}  4%,7.9% {opacity:1}  8%,100% {opacity:0} }
    @keyframes l3 { 0%,7.9% {opacity:0}  8%,12.9% {opacity:1} 13%,100% {opacity:0} }
    @keyframes l4 { 0%,12.9% {opacity:0} 13%,25.9% {opacity:1} 26%,100% {opacity:0} }
    @keyframes l5 { 0%,25.9% {opacity:0} 26%,100% {opacity:1} }

    /* Output appears after the model's think time; the answer prints at once. */
    #out { animation-name: out }
    @keyframes out { 0%,41.9% {opacity:0} 42%,100% {opacity:1} }
    #nxt { animation-name: nxt }
    @keyframes nxt { 0%,51.9% {opacity:0} 52%,100% {opacity:1} }
  </style>

  <rect x="0.5" y="0.5" width="819" height="289" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 34.5h819" stroke="#30363d"/>
  <circle cx="21" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="39" cy="17" r="5" fill="#febc2e"/>
  <circle cx="57" cy="17" r="5" fill="#28c840"/>
  <text class="t dim" x="410" y="22" font-size="12" text-anchor="middle">zsh — qmark</text>

  <g class="t">
    <g class="anim" id="l1"><text x="18" y="62" class="grn">$ <tspan class="fg">▮</tspan></text></g>
    <g class="anim" id="l2"><text x="18" y="62" class="grn">$ <tspan class="fg">qmark ▮</tspan></text></g>
    <g class="anim" id="l3"><text x="18" y="62" class="grn">$ <tspan class="fg">qmark explain ▮</tspan></text></g>
    <g class="anim" id="l4"><text x="18" y="62" class="grn">$ <tspan class="fg">qmark explain "rm -rf ./build"▮</tspan></text></g>
    <g class="anim" id="l5"><text x="18" y="62" class="grn">$ <tspan class="fg">qmark explain "rm -rf ./build"</tspan></text></g>

    <g class="anim" id="out">
      <text x="18" y="90" class="dim">── qmark ── explain ────────────────────────────────────────</text>
      <text x="18" y="118" class="fg">    rm -rf ./build</text>
      <text x="18" y="146" class="fg">The command `rm -rf ./build` deletes the directory named `./build` and all its contents</text>
      <text x="18" y="167" class="fg">recursively. The `-r` option tells `rm` to remove directories and their contents, while the</text>
      <text x="18" y="188" class="fg">`-f` option forces deletion without prompting for confirmation. This is a destructive</text>
      <text x="18" y="209" class="fg">operation that can't be undone, so it's important to double-check the command before</text>
      <text x="18" y="230" class="fg">running it.</text>
    </g>

    <g class="anim" id="nxt"><text x="18" y="264" class="grn">$ <tspan class="fg">▮</tspan></text></g>
  </g>
</svg>
