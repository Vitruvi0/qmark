[package]
name = "qmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cisco-style `?` help for your terminal, with AI explanations in plain English."
license = "MIT"
repository = "https://github.com/Vitruvi0/qmark"
readme = "README.md"
keywords = ["cli", "help", "terminal", "shell", "ai"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
